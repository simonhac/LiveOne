<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Gousher inspector</title><style>body{font:16px system-ui;background:#f6f7f8;color:#172330;max-width:1100px;margin:3rem auto;padding:0 1rem}input,button{font:inherit;padding:.6rem}pre{background:white;border:1px solid #ccd4dc;border-radius:8px;padding:1.2rem;overflow:auto}.badge{color:#975300}label{display:block;margin-bottom:1rem}</style><h1>Gousher</h1><p class="badge">Shadow trial · generator control disabled</p><label>Inspector token <input type="password" id="token" autocomplete="off"> <button id="connect">Connect</button></label><p id="status">Enter the inspector token to view collection, delivery and storage health.</p><pre id="state"></pre><script>let timer;document.querySelector('#connect').onclick=()=>{clearInterval(timer);const token=document.querySelector('#token').value;const update=async()=>{try{const r=await fetch('/api/usher/state',{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('Inspector request failed ('+r.status+')');document.querySelector('#state').textContent=JSON.stringify(await r.json(),null,2);document.querySelector('#status').textContent='Updated '+new Date().toLocaleTimeString()}catch(e){document.querySelector('#status').textContent=e.message}};update();timer=setInterval(update,2000)};</script></html>
