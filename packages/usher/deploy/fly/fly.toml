# usher hub — permanent Fly.io WireGuard hub (app "liveone-flyhub").
#
# DOCS: ../../docs/deploy-fly.md (procedure) · ../../docs/operations.md (triage) · ../../README.md
#
# One usher manages both sites over WireGuard:
#   • sheephouse UDM (primary site, Starlink CGNAT) → DeepSea generator (musher)
#   • kinkora UDM (standard DSL) → two Fronius inverters (fusher)
# The inspector is fronted by Cloudflare Access (cloudflared) at usher.liveone.energy — the Fly IP
# exposes ONLY the WireGuard UDP port. The sources are configured in the baked usher.yaml (USHER_CONFIG).
#
# Deploy from the repo root (monorepo build context = "." ; the Dockerfile path in [build] below is
# resolved relative to THIS fly.toml's directory):
#   fly deploy . -c packages/usher/deploy/fly/fly.toml --ha=false
#
# Secrets (fly secrets set …), NOT here:
#   WG_PRIVKEY               hub WireGuard private key (reuse the probe's → hub pubkey unchanged)
#   SHEEPHOUSE_PEER_PUBKEY   sheephouse UDM WG public key
#   KINKORA_PEER_PUBKEY      kinkora UDM WG public key
#   KINKORA_DEVICE_CIDRS     the two Fronius inverter /32s, comma-separated ("10.0.1.190/32,10.0.1.191/32")
#   TUNNEL_TOKEN             cloudflared tunnel token (Cloudflare Access → usher.liveone.energy)
#   MUSHER_API_KEY           gusher gk_ key for system "sheephouse" (the name usher.example.yaml's
#                            `apiKeyEnv` actually reads — NOT "SHEEPHOUSE_API_KEY", as this comment
#                            previously claimed; provisioning that name silently yields no auth)
#   KINKORA_API_KEY          gusher gk_ key for system "kinkora"
app = "liveone-flyhub"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  # Non-secret WG addressing (peer pubkeys + inverter CIDRs are secrets; see above).
  WG_ADDR = "10.9.0.1/24"
  SHEEPHOUSE_PEER_WG_IP = "10.9.0.2/32"
  SHEEPHOUSE_DEVICE_CIDRS = "10.0.1.244/32"
  KINKORA_PEER_WG_IP = "10.9.0.3/32"
  # On-disk store (blackbox journal + outage spool) on the persistent volume (see [mounts]).
  USHER_DATA_DIR = "/data/usher"
  # ── TEMPORARY: DeepSea diagnostics (debugging the Daylesford genset start trigger) ──────────────
  # Captures the FULL register dump (~100 regs: decoded value + raw words + sentinel reason) on EVERY
  # poll — idle included — to /data/usher/diag/YYYY-MM-DD.jsonl (gzipped on the day roll).
  # Declared here, NOT as a secret: these are plain config, and keeping them visible in the repo is
  # the point — the flag was previously set out-of-band, so nobody knew capture was off and the
  # 2026-07-26 run was lost. At the temporary 15 s cadence (usher.example.yaml) this costs ~52 MB/day
  # uncompressed, but only ~0.5 MB/day once rolled — these records are near-identical, so gzip gets
  # ~106:1 (measured, not estimated). The journal enforces a 100 MB cap on the diag dir, purging
  # OLDEST first; the live day file dominates it, leaving roughly three months of history. To turn
  # off: set MUSHER_DIAGNOSTICS = "0" and redeploy, then prune /data/usher/diag.
  MUSHER_DIAGNOSTICS = "1"
  # Polls to hold the fast cadence after a run ends — a fine-resolution cool-down baseline. Does NOT
  # gate capture (that is unconditional). At the 15 s cadence, 60 ticks ≈ 15 minutes.
  MUSHER_DIAG_POSTRUN_TICKS = "60"

# Persistent volume for the usher store — survives deploys/restarts, so an outage backlog is never
# lost to a redeploy. CREATE THE VOLUME BEFORE THE FIRST DEPLOY WITH THIS BLOCK (the deploy fails
# without it):  fly volumes create usher_data --size 1 --region syd -a liveone-flyhub
[mounts]
  source = "usher_data"
  destination = "/data"

# WireGuard inbound on the dedicated IPv4. Always-on hub (no autostop) so the UDMs stay handshook.
# No HTTP service is published — the inspector is reached only via the Cloudflare tunnel.
[[services]]
  protocol = "udp"
  internal_port = 51820
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[services.ports]]
    port = 51820

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
