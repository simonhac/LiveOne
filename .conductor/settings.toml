"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
# `npm install` bootstraps deps (incl. @simon/workspace-env) before the wrapper imports it.
# `npx --yes tsx` avoids the install-prompt deadlock in a fresh worktree (LiveOne#355).
setup = "npm install && npx --yes tsx env/setup.mts"
run = "npx --yes tsx env/run.mts"
run_mode = "concurrent"
