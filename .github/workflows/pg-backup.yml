name: liveone PG backup → R2     # keep this name — pg-dashboard's workflow_run references it

# Off-site GFS Postgres → R2 backup, via the reusable the-gitfather workflow. 2-hourly grandson tier
# promoted to daily/weekly/monthly at the profile's anchor-hour-utc. Project config lives in
# pg-backup/liveone.yaml; the engine + docs are at https://github.com/simonhac/the-gitfather.
# Secrets are passed explicitly (the engine repo is a different repo, so `secrets: inherit` won't carry).

on:
  # Scheduling is driven by the Cloudflare scheduler (simonhac/the-gitfather → scheduler/), which fires
  # this via workflow_dispatch. No GitHub cron; the staleness watchdog + HEARTBEAT_URL remain the backstop.
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this run fired; the self-heal passes 'self-heal' (drives the Slack row's marker, which the-gitfather's scheduler posts)."
        type: string
        default: manual

concurrency:
  group: pg-backup
  cancel-in-progress: false

jobs:
  backup:
    # id-token: the job's last step tells the-gitfather's scheduler it finished (GitHub OIDC — no stored secret);
    # the scheduler then posts the run to Slack.
    permissions: { contents: read, id-token: write }
    uses: simonhac/the-gitfather/.github/workflows/pg-backup.yml@main
    with:
      profile: pg-backup/liveone.yaml
      r2_bucket: ${{ vars.R2_BUCKET }}
      notify_url: ${{ vars.GITFATHER_NOTIFY_URL }}
      trigger: ${{ github.event_name == 'schedule' && 'schedule' || github.event.inputs.reason }}
    secrets:
      PG_BACKUP_DATABASE_URL: ${{ secrets.PG_BACKUP_DATABASE_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}                 # optional — dead-man's-switch
