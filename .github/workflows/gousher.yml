name: gousher
on:
  pull_request:
    paths:
      - "packages/gousher/**"
      - "packages/usher/**"
      - "lib/collectors/**"
      - "app/api/gush/**"
      - "lib/db/planetscale/**"
      - "drizzle-planetscale/**"
      - "lib/vendors/selectronic/**"
      - "lib/vendors/sigenergy/**"
      - ".github/workflows/gousher.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: false
      - run: go test -race ./...
        working-directory: packages/gousher
      - run: go vet ./...
        working-directory: packages/gousher
      - run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./cmd/...
        working-directory: packages/gousher

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: packages/gousher/tools/integration.sh
